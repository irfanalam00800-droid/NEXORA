<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NEXORA Registration - Student Tech Hub"
    >

    <title>NEXORA | Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND -->

    <div class="background">

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="grid"></div>

    </div>


    <!-- NAVIGATION -->

    <header>

        <nav>

            <a
                href="index.html"
                class="logo"
            >
                NEXORA<span>.</span>
            </a>


            <a
                href="login.html"
                class="menu-btn"
                aria-label="Back to login"
            >
                ←
            </a>

        </nav>

    </header>


    <!-- REGISTRATION -->

    <main>

        <section
            class="section login-section"
            id="register"
        >

            <p class="section-tag">
                JOIN NEXORA
            </p>


            <h2>

                Create Your

                <span>
                    NEXORA Account.
                </span>

            </h2>


            <p class="section-description">

                Create your account and start
                your student technology journey.

            </p>


            <div class="auth-container">


                <!-- REGISTER CARD -->

                <div class="auth-card">

                    <div class="auth-icon">
                        🚀
                    </div>


                    <h3>
                        Create Account
                    </h3>


                    <p class="auth-subtitle">
                        Join NEXORA and start your journey
                    </p>


                    <!-- REGISTER FORM -->

                    <form id="registerForm">

                        <div class="input-group">

                            <label for="registerName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="registerName"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="registerEmail">
                                Email
                            </label>

                            <input
                                type="email"
                                id="registerEmail"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="registerPassword">
                                Password
                            </label>

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn auth-btn"
                        >
                            Create Account
                        </button>

                    </form>


                    <!-- BACK TO LOGIN -->

                    <a
                        href="login.html"
                        class="forgot-link"
                    >
                        Already have an account? Login
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="logo">
            NEXORA<span>.</span>
        </div>


        <p>
            © 2026 NEXORA. All rights reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
